{% extends 'base.html' %}

{% block title %}Home{% endblock title %}

{% block body %}
<section class="text-gray-600 body-font bg-gray-200">
  <div class="container mx-auto flex px-5 py-24 md:flex-row flex-col items-center">
    <div class="lg:flex-grow md:w-1/2 lg:pr-24 md:pr-16 flex flex-col md:items-start md:text-left mb-16 md:mb-0 items-center text-center">
      <h1 class="title-font sm:text-4xl text-3xl mb-4 font-medium text-gray-900">
        DEYAAR DEVELOPERS
      </h1>
      <h5>
        <p class="mb-8 leading-relaxed">Always deliver more than expected</p>
      </h5>
      <div class="flex justify-center">
        <a href="/about">
          <button class="inline-flex text-white bg-indigo-500 border-0 py-2 px-6 focus:outline-none hover:bg-indigo-600 rounded text-lg">
            Know more →
          </button>
        </a>
      </div>
    </div>
    <div class="lg:max-w-lg lg:w-full md:w-1/2 w-5/6">
      <img class="object-cover object-center rounded" alt="hero" src="https://i.postimg.cc/nL4Z6df7/logo.png/720x600">
    </div>
  </div>
</section>

<footer class="text-light-600 body-font bg-indigo-300">
  <div class="container px-5 py-8 mx-auto flex items-center sm:flex-row flex-col">
    <a class="flex title-font font-medium items-center md:justify-start justify-center text-gray-900">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor"
           class="w-10 h-10 text-white p-2 bg-indigo-500 rounded-full" viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
      </svg>
      <span class="ml-3 text-xl">DEYAAR DEVELOPERS</span>
    </a>
    <p class="text-sm text-gray-500 sm:ml-4 sm:pl-4 sm:border-l-2 sm:border-gray-200">
      © 2022 Pvt Ltd —
      <a href="https://twitter.com/knyttneve" class="text-gray-600 ml-1" target="_blank">@Jawed Alam</a>
    </p>
  </div>
</footer>
{% endblock body %}
