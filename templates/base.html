<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- ✅ Load Tailwind First -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ✅ Then Load Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

    <!-- ✅ Scope Bootstrap to prevent conflicts -->
    <style>
      .bootstrap-scope {
        all: revert;
        box-sizing: border-box;
      }
    </style>

    <link rel="shortcut icon" href="/logo.ico" type="image/x-icon" />

    <title>{% block title %}{% endblock title %} | Deyaar site</title>
  </head>
  <body>

    <!-- ✅ Bootstrap (scoped) Navbar -->
    <div class="bootstrap-scope">
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Deyaar</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                  data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                  aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/about">About</a>
              </li>
              <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
                   data-bs-toggle="dropdown" aria-expanded="false">
                  Companies
                </a>
                <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                  <li><a class="dropdown-item" href="https://www.shriramproperties.com/">Shriram Properties</a></li>
                  <li><a class="dropdown-item" href="#">Success Key</a></li>
                  <li><a class="dropdown-item" href="https://ashirwadengicongroup.com/">Ashirwad Engicon</a></li>
                </ul>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/contact">Contact</a>
              </li>
            </ul>
            <form class="d-flex">
              <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
              <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
          </div>
        </div>
      </nav>
    </div>

    <!-- ✅ Main Content Block -->
    {% block body %}{% endblock body %}

    <!-- ✅ Bootstrap JS Bundle (for navbar toggle, dropdowns etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
